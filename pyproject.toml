[project]
name = "medsentinel-triage"
version = "0.1.0"
description = "Modular production-ready multimodal clinical triage AI inference codebase and FastAPI web application"
readme = "README.md"
authors = [
    { name = "Yash", email = "yashh2417@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "langchain>=0.3.0",
    "langchain-classic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "lightgbm>=4.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "shap>=0.46.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
medsentinel-triage = "medsentinel_triage:main"
medsentinel-web = "medsentinel_triage.api.server:main"
medsentinel-input = "medsentinel_triage.input_processor:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
